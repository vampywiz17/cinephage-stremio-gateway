name: Publish container

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify project version
        run: node scripts/check-release-version.js
      - name: Verify release tag matches the project version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.js "$GITHUB_REF_NAME"
      - id: version
        name: Resolve version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vampywiz17/cinephage-stremio-gateway
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            version="${{ steps.version.outputs.version }}"
            notes=$(cat <<EOF
          ## Docker release

          Multi-platform container image for **linux/amd64** and **linux/arm64**:

          \`\`\`shell
          docker pull ghcr.io/vampywiz17/cinephage-stremio-gateway:$version
          \`\`\`

          Published tags: \`$version\`, \`${version%.*}\`, \`${version%%.*}\`, and \`latest\`.
          Use the repository's \`docker-compose.yml\` as the reference deployment configuration.
          EOF
            )
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "Cinephage Stremio Gateway $GITHUB_REF_NAME (Docker)" \
              --notes "$notes"
          fi
